name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New version name (e.g. 1.2.3) — release tag will be created as v<version>'
        required: true
        type: string

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional: test the future runtime now
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Validate version_name input
      run: |
        VERSION_NAME="${{ inputs.version_name }}"

        # Reject branch-like names that must never be used as tags
        RESERVED_NAMES="main master develop dev release"
        for reserved in $RESERVED_NAMES; do
          if [ "$VERSION_NAME" = "$reserved" ]; then
            echo "::error::version_name '${VERSION_NAME}' is a reserved branch name and cannot be used as a version/tag."
            exit 1
          fi
        done

        # Require the version to match a semver-like pattern (no leading 'v'; release tag will be v<version>)
        if ! echo "$VERSION_NAME" | grep -qE '^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
          echo "::error::version_name '${VERSION_NAME}' is invalid. Use a semver-like format such as '1.2.3' or '1.2.3-beta.1'. The release tag will be created as v${VERSION_NAME}."
          exit 1
        fi

        echo "version_name '${VERSION_NAME}' is valid. Release tag will be: v${VERSION_NAME}"

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Only the parts of libjxl the JPEG XL decoder builds from (its tests and test data are huge).
    - name: Fetch libjxl source
      run: |
        git submodule update --init --depth 1 app/src/main/cpp/libjxl
        git -C app/src/main/cpp/libjxl submodule update --init --depth 1 \
          third_party/highway third_party/brotli third_party/skcms

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        else
          echo "No keystore secret found, creating debug keystore"
          keytool -genkey -v -keystore release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"
        fi

    - name: Update versionName and increment versionCode
      run: |
        VERSION_NAME="${{ inputs.version_name }}"
        BUILD_GRADLE="app/build.gradle"

        sed -i -E "s/(versionName = ')[^']*(')/\1${VERSION_NAME}\2/" "$BUILD_GRADLE"
        CURRENT_CODE=$(grep -E "versionCode = [0-9]+" "$BUILD_GRADLE" | head -n1 | sed -E "s/.*= ([0-9]+)/\1/")
        NEXT_CODE=$((CURRENT_CODE + 1))
        sed -i -E "s/versionCode = [0-9]+/versionCode = ${NEXT_CODE}/" "$BUILD_GRADLE"
        # Keep the README's direct APK download links pointing at this release
        sed -i -E "s#releases/download/v[^/]+/DropSauce-v[^)\"]+\.apk#releases/download/v${VERSION_NAME}/DropSauce-v${VERSION_NAME}.apk#g" README.md

        # Release notes = the "Unreleased" section of CHANGELOG.md, which then becomes this version's section
        awk '/^## /{f = ($0 == "## Unreleased"); next} f' CHANGELOG.md > "$RUNNER_TEMP/unreleased.md"
        if grep -q '^- ' "$RUNNER_TEMP/unreleased.md"; then
          awk -v heading="## ${VERSION_NAME} ($(date +%F))" '$0 == "## Unreleased" {print; print ""; print heading; next} 1' CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
          # F-Droid shows this per-version file (plain text, at most 500 characters)
          FDROID_CHANGELOG="fastlane/metadata/android/en-US/changelogs/${NEXT_CODE}.txt"
          mkdir -p "$(dirname "$FDROID_CHANGELOG")"
          # Whole lines only, so a line (or a multi-byte character) is never cut in half
          grep '^- ' "$RUNNER_TEMP/unreleased.md" | awk '{ n += length($0) + 1; if (n > 500) exit; print }' > "$FDROID_CHANGELOG"
        fi

    - name: Build Release APK
      run: |
        ./gradlew assembleGithubRelease --no-daemon --stacktrace \
          -PRELEASE_STORE_FILE=../release.keystore \
          -PRELEASE_STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD || 'password' }}" \
          -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS || 'release' }}" \
          -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD || 'password' }}"

    - name: Commit version updates
      id: version_commit
      run: |
        BRANCH_NAME="${{ github.ref_name }}"

        if git diff --quiet -- app/build.gradle; then
          echo "No version changes to commit"
          echo "commit_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle README.md CHANGELOG.md fastlane
        git commit -m "chore(release): set versionName ${{ inputs.version_name }} and bump versionCode"

        # Use refs/heads/ explicitly to avoid ambiguity with any tag that shares the branch name
        for attempt in 1 2 3; do
          if git push origin "HEAD:refs/heads/$BRANCH_NAME"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Failed to push version commit after 3 attempts"
            exit 1
          fi
          git pull --rebase origin "refs/heads/$BRANCH_NAME"
          sleep 2
        done

        echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Generate Changelog
      id: changelog
      run: |
        if grep -q '^- ' "$RUNNER_TEMP/unreleased.md"; then
          CHANGELOG=$(cat "$RUNNER_TEMP/unreleased.md")
        else
          # Nothing was written in CHANGELOG.md: fall back to the commit subjects since the previous release
          CURRENT_SHA="${{ steps.version_commit.outputs.commit_sha }}"

          # The new tag does not exist yet, so this resolves to the previous release tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$CURRENT_SHA" 2>/dev/null || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$CURRENT_SHA"
          else
            RANGE="$CURRENT_SHA"
          fi

          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -n 50 --invert-grep --grep='^chore(release): set versionName ' $RANGE)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes since ${PREVIOUS_TAG:-the last release}"
          fi
        fi

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Collect Release APKs
      run: |
        mkdir -p release
        # Only the GitHub version; F-Droid builds and signs its own version from the tag.
        cp app/build/outputs/apk/github/release/app-github-release.apk "release/DropSauce-v${{ inputs.version_name }}.apk"

    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ inputs.version_name }}"
        NOTES_FILE="release_notes.md"

        cat > "$NOTES_FILE" <<'EOF'
        ## Changelog
        ${{ steps.changelog.outputs.changelog }}

        ## Installation Instructions
        1. Download and install the apk file first
        2. Go to the Explore menu > Manage and click the pen icon to add an extension repo
        3. Install and use the extensions, read, add items to the favorites and ENJOY!

        If this is your first time using the app, I recommend uninstalling any extension you find when opening the app for the first time and then installing latest extensions from your preferred repository.
        EOF

        gh release create "$TAG" release/*.apk \
          --title "$TAG" \
          --target "${{ steps.version_commit.outputs.commit_sha }}" \
          --notes-file "$NOTES_FILE"
