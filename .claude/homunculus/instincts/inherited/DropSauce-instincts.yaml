# DropSauce Workflow Feature Development With Viewmodel And Model Update

## Action

Follow the feature-development-with-viewmodel-and-model-update workflow:
1. Update or create ViewModel class for the UI feature (e.g., FeedViewModel.kt)
2. Modify or add domain/model classes (e.g., TrackingLogItem.kt, MangaListMapper.kt)
3. Update or create data access objects or repositories as needed (e.g., TracksDao.kt, TrackingRepository.kt, ChaptersDao.kt)
4. Update or add UI adapters or models (e.g., FeedItemAD.kt, FeedItem.kt)
5. Update supporting utility or extension files if necessary (e.g., Date.kt)
6. Update resource files if needed (e.g., plurals.xml)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: app/src/main/kotlin/org/koitharu/kotatsu/tracker/ui/feed/FeedViewModel.kt, app/src/main/kotlin/org/koitharu/kotatsu/tracker/domain/model/TrackingLogItem.kt, app/src/main/kotlin/org/koitharu/kotatsu/list/domain/MangaListMapper.kt

